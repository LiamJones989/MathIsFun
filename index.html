<!DOCTYPE html>
<html>
<head>
    <title>Prank</title>
</head>

<body>

<script>
const TOTAL = 150;
let opened = 0;

function startPrank() {
    function openNext() {
        if (opened >= TOTAL) {
            return;
        }

        const width = 300;
        const height = 200;

        const left = Math.random() * (screen.width - width);
        const top = Math.random() * (screen.height - height);

        const popup = window.open(
            "",
            "_blank",
            `width=${width},height=${height},left=${left},top=${top}`
        );

        if (!popup) {
            document.body.innerHTML = `
                <h1>Pop-ups are blocked</h1>
                <p>Allow pop-ups for this site and reload the page.</p>
            `;
            return;
        }

        popup.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>MathIsFun ${opened + 1}</title>
            </head>

            <body style="
                margin:0;
                background:#${Math.floor(
                    Math.random() * 16777215
                ).toString(16).padStart(6, "0")};
                color:white;
                font-family:Arial;
                text-align:center;
            ">

                <h1>PRANK ${opened + 1}</h1>

            </body>
            </html>
        `);

        popup.document.close();

        opened++;

        setTimeout(openNext, 100);
    }

    openNext();
}

// Automatically attempt to start when the page loads
window.addEventListener("load", startPrank);
</script>

</body>
</html>
